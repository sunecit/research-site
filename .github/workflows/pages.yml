name: Publish MkDocs site

# Запуск при отправке изменений в main или вручную.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Публикации выполняются последовательно.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать исходники
        uses: actions/checkout@v7

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
          cache: pip

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Проверить зависимости
        run: python -m pip check

      - name: Собрать сайт со строгой проверкой
        run: mkdocs build --strict

      - name: Сохранить собранный сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Собрать сайт для Helios
        env:
          SITE_URL: https://se.ifmo.ru/~s334574/
        run: mkdocs build --strict

      - name: Сохранить сборку для Helios
        uses: actions/upload-pages-artifact@v4
        with:
          name: helios-site
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-helios:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Скачать собранный сайт
        uses: actions/download-artifact@v8
        with:
          name: helios-site
          path: artifact/

      - name: Распаковать сайт
        run: |
          mkdir -p site
          tar -xf artifact/artifact.tar -C site
          test -f site/index.html

      - name: Настроить SSH
        env:
          SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/helios_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/helios_deploy ~/.ssh/known_hosts

      - name: Загрузить сайт на Helios
        run: |
          rsync -rtz \
            --chmod=D755,F644 \
            --rsync-path=/usr/local/bin/rsync \
            -e "ssh -p 2222 -i $HOME/.ssh/helios_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30" \
            site/ \
            s334574@helios.cs.ifmo.ru:/home/studs/s334574/public_html/

      - name: Удалить временный ключ с раннера
        if: always()
        run: rm -f ~/.ssh/helios_deploy
