name: Publish MkDocs site

# Запуск при отправке изменений в main или вручную.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Публикации выполняются последовательно.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать исходники
        uses: actions/checkout@v7

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
          cache: pip

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Проверить зависимости
        run: python -m pip check

      - name: Собрать сайт со строгой проверкой
        run: mkdocs build --strict

      - name: Сохранить собранный сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
