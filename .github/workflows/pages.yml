name: Publish MkDocs site

# Запуск при отправке тега версии, например v1.0 или v1.1.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Публикации выполняются последовательно.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Скачать исходники и историю выпусков
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
          cache: pip

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Проверить зависимости
        run: python -m pip check

      - name: Настроить автора автоматических коммитов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Подготовить версии для обеих площадок
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Ожидается тег вида v1.0 или v1.1"
            exit 1
          fi

          printf '%s\n' "$GITHUB_SHA" > docs/release-commit.txt

          for branch in gh-pages helios-pages; do
            if [ "$branch" = "gh-pages" ]; then
              export SITE_URL="https://sunecit.github.io/research-site/"
            else
              export SITE_URL="https://se.ifmo.ru/~s334574/"
            fi

            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              git branch "$branch" "origin/$branch"
            fi

            # Существующий выпуск не заменяем другим коммитом.
            if git cat-file -e "$branch:$VERSION/index.html" 2>/dev/null; then
              saved_commit=$(git show "$branch:$VERSION/release-commit.txt")
              if [ "$saved_commit" != "$GITHUB_SHA" ]; then
                echo "Нельзя перезаписать существующий выпуск другим коммитом"
                exit 1
              fi
              echo "$VERSION уже собрана из этого коммита"
            else
              # Сохраняем новый выпуск и обновляем указатель latest.
              mike deploy --branch "$branch" \
                --update-aliases --alias-type redirect \
                "$VERSION" latest
              mike set-default --branch "$branch" latest
            fi

            mkdir -p "$RUNNER_TEMP/$branch"
            git archive "$branch" | tar -x -C "$RUNNER_TEMP/$branch"
          done

          git push --atomic origin gh-pages helios-pages

      - name: Сохранить все версии для GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/gh-pages

      - name: Сохранить все версии для Helios
        uses: actions/upload-pages-artifact@v4
        with:
          name: helios-site
          path: ${{ runner.temp }}/helios-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-helios:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Скачать собранный сайт
        uses: actions/download-artifact@v8
        with:
          name: helios-site
          path: artifact/

      - name: Распаковать сайт
        run: |
          mkdir -p site
          tar -xf artifact/artifact.tar -C site
          test -f site/index.html

      - name: Настроить SSH
        env:
          SSH_KEY: ${{ secrets.HELIOS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/helios_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/helios_deploy ~/.ssh/known_hosts

      - name: Загрузить сайт на Helios
        run: |
          rsync -rtz \
            --chmod=D755,F644 \
            --rsync-path=/usr/local/bin/rsync \
            -e "ssh -p 2222 -i $HOME/.ssh/helios_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30" \
            site/ \
            s334574@helios.cs.ifmo.ru:/home/studs/s334574/public_html/

      - name: Удалить временный ключ с раннера
        if: always()
        run: rm -f ~/.ssh/helios_deploy
